<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ・資料請求 | 株式会社 奥工務店</title>
<style>
body { margin: 0; padding: 0; font-family: "Times New Roman", "Yu Mincho", "游明朝", serif; background-color: #f9f6f0; color: #2c2520; line-height: 1.9; letter-spacing: 0.05em; }
header { background-color: rgba(255, 255, 255, 0.95); border-bottom: 1px solid #e3dbc8; padding: 25px 8%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.logo h1 { margin: 0; font-size: 26px; color: #4a3b32; font-weight: 500; letter-spacing: 0.1em; }
nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 35px; }
nav a { text-decoration: none; color: #4a3b32; font-weight: bold; font-size: 14px; font-family: sans-serif; }
nav a:hover { color: #aa8755; }
.container { max-width: 700px; margin: 60px auto; padding: 0 20px; }
h2 { font-size: 28px; color: #4a3b32; text-align: center; font-weight: 400; margin-bottom: 50px; position: relative; padding-bottom: 15px; }
h2::after { content: ''; position: absolute; width: 40px; height: 1px; bottom: 0; left: 50%; transform: translateX(-50%); background-color: #aa8755; }

.form-group { margin-bottom: 30px; }
.form-group label { display: block; font-size: 15px; font-weight: bold; color: #4a3b32; margin-bottom: 10px; }
.form-group label span { background-color: #aa8755; color: white; font-size: 11px; padding: 2px 8px; margin-left: 10px; vertical-align: middle; font-family: sans-serif; }
.form-control { width: 100%; padding: 15px; border: 1px solid #eee6d8; background-color: white; font-size: 15px; box-sizing: border-box; font-family: serif; }
.form-control:focus { outline: none; border-color: #aa8755; }

.btn-area { text-align: center; margin-top: 40px; }
.submit-btn { background-color: #4a3b32; color: #f9f6f0; border: 1px solid #4a3b32; padding: 18px 60px; font-size: 15px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; font-family: sans-serif; }
.submit-btn:hover { background-color: transparent; color: #4a3b32; }

footer { background-color: #2c2520; color: #e3dbc8; text-align: center; padding: 40px 20px; font-size: 12px; margin-top: 100px; font-family: sans-serif; }
@media (max-width: 900px) { nav ul { display: none; } }
</style>
</head>
<body>
<header>
<div class="logo">
<h1>株式会社 奥工務店</h1>
</div>
<nav>
<ul>
<li><a href="index.html">奥工務店の家づくり</a></li>
<li><a href="gallery.html">施工事例</a></li>
<li><a href="about.html">会社案内</a></li>
<li><a href="contact.html" style="color: #aa8755;">お問い合わせ</a></li>
</ul>
</nav>
</header>
<div class="container">
<h2>資料請求・お問い合わせ</h2>
<form>
<div class="form-group">
<label>お名前<span>必須</span></label>
<input type="text" class="form-control" placeholder="例：山田 太郎">
</div>
<div class="form-group">
<label>メールアドレス<span>必須</span></label>
<input type="email" class="form-control" placeholder="例：yamada@example.com">
</div>
<div class="form-group">
<label>お問い合わせ内容<span>必須</span></label>
<textarea class="form-control" rows="6" placeholder="ご希望の施工内容や、資料請求の旨をご記入ください。"></textarea>
</div>
<div class="btn-area">
<button type="button" class="submit-btn" onclick="alert('これは試作画面です。実際には送信されません。')">この内容で送信する</button>
</div>
</form>
</div>
<footer><p>&copy; 株式会社 奥工務店 All Rights Reserved.</p></footer>
</body>
</html>
